<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b5752"><title>Open House Sign-In | Eric Hepple</title><link rel="stylesheet" href="./styles.css?v=30"><style>body{min-height:100vh;padding:24px;background:var(--paper)}.sign-shell{width:min(760px,100%);margin:auto}.sign-brand{text-align:center;margin:18px 0 24px}.sign-brand .mark{margin:auto;width:56px;height:56px}.sign-brand h1{font:38px Georgia;margin:14px 0 4px}.sign-brand p{color:var(--muted);margin:0}.sign-card,.property-marketing{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.sign-card .form-grid{padding:24px}.sign-intro{padding:24px 24px 0}.sign-intro h2{font:27px Georgia;margin:0 0 5px}.sign-intro p{color:var(--muted);margin:0}.consent{display:flex;grid-column:1/-1;gap:10px;align-items:flex-start;color:var(--muted);font-size:12px}.consent input{width:auto;margin-top:3px}.sign-submit{width:100%;min-height:52px}.success{padding:42px;text-align:center}.success h2{font:32px Georgia;margin:0 0 10px}.property-marketing{margin-top:22px}.property-hero{width:100%;max-height:440px;object-fit:cover;display:block}.property-copy{padding:26px}.property-copy h2{font:32px Georgia;margin:0}.property-price{font:25px Georgia;color:var(--green);margin:7px 0}.property-facts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.property-facts span{background:var(--green2);padding:7px 10px;border-radius:20px;font-weight:800}.property-description{white-space:pre-wrap;color:var(--muted)}.feature-list{padding-left:20px}.property-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 26px 26px}.property-gallery img{width:100%;height:220px;object-fit:cover;border-radius:9px}.property-links{display:flex;gap:9px;flex-wrap:wrap;padding:0 26px 28px}.property-links .btn{text-decoration:none;flex:1;text-align:center}.preview-note{background:#f1e6d7;color:#725f4d;padding:10px 16px;text-align:center;font-weight:800}@media(max-width:720px){body{padding:14px}.sign-brand h1{font-size:31px}.sign-card .form-grid{padding:18px}.property-copy{padding:20px}.property-gallery{grid-template-columns:1fr;padding:0 20px 20px}.property-gallery img{height:240px}.property-links{padding:0 20px 22px}}</style></head><body><main class="sign-shell"><header class="sign-brand"><div class="mark">EH</div><h1>Welcome</h1><p>Eric Hepple · Paradise Property Brokers, Inc.</p></header><section class="sign-card" id="signCard"><div class="sign-intro"><div class="eyebrow">OPEN HOUSE</div><h2 id="propertyAddress">Property Sign-In</h2><p>Tell me what you are looking for so I can send relevant properties and answer your questions.</p></div><form id="signInForm" class="form-grid"><label class="field"><span>First name</span><input name="first_name" required autocomplete="given-name"></label><label class="field"><span>Last name</span><input name="last_name" required autocomplete="family-name"></label><label class="field"><span>Cell number</span><input name="phone" type="tel" required autocomplete="tel"></label><label class="field"><span>Email</span><input name="email" type="email" required autocomplete="email"></label><label class="field"><span>I am interested in</span><select name="role"><option value="Buyer">Buying</option><option value="Seller">Selling</option><option value="Buyer,Seller">Buying and selling</option></select></label><label class="field"><span>Buying timeframe</span><select name="timeframe"><option>Immediately</option><option>0–3 months</option><option>3–6 months</option><option>6–12 months</option><option>Just researching</option></select></label><label class="field"><span>Minimum price</span><input name="budget_min" type="number" min="0" step="1000"></label><label class="field"><span>Maximum price</span><input name="budget_max" type="number" min="0" step="1000"></label><label class="field"><span>Minimum bedrooms</span><select name="bedrooms"><option value="">No preference</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label class="field"><span>Pool</span><select name="pool"><option value="">No preference</option><option>Yes</option><option>No</option></select></label><label class="field"><span>Preferred area</span><input name="area"></label><label class="field"><span>Important feature</span><input name="important_feature"></label><label class="field"><span>Currently working with an agent?</span><select name="agent_status"><option>No</option><option>Yes</option></select></label><label class="field"><span>Pre-approved?</span><select name="preapproved"><option>Not yet</option><option>Yes</option><option>Cash buyer</option></select></label><label class="consent"><input name="consent" type="checkbox" required><span>I agree that Eric Hepple may contact me by phone, text, or email about this property and related real-estate services. Consent is not required to purchase.</span></label><div class="form-actions"><button class="btn primary sign-submit">Complete sign-in</button></div></form><div id="signSuccess" class="success" hidden><h2>Thank you!</h2><p>Your information has been received. The property information is below.</p></div></section><section id="propertyMarketing" class="property-marketing" hidden></section></main><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="./open-house.js?v=31"></script></body></html>
